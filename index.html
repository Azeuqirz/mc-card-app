// ---------- Lineaire algebra ----------
function solveLin(A,b){
  var n=b.length, M=A.map(function(r,i){ return r.concat([b[i]]); }), i,k,j;
  for(i=0;i<n;i++){
    var piv=i;
    for(k=i+1;k<n;k++) if(Math.abs(M[k][i])>Math.abs(M[piv][i])) piv=k;
    if(Math.abs(M[piv][i])<1e-9) return null;
    var t=M[i]; M[i]=M[piv]; M[piv]=t;
    for(k=i+1;k<n;k++){
      var f=M[k][i]/M[i][i];
      for(j=i;j<=n;j++) M[k][j]-=f*M[i][j];
    }
  }
  var x=new Array(n);
  for(i=n-1;i>=0;i--){
    var s=M[i][n];
    for(j=i+1;j<n;j++) s-=M[i][j]*x[j];
    x[i]=s/M[i][i];
  }
  return x;
}
function homography(quad,W,H){
  // v2.7 FIX: stelsel omgekeerd — we lossen OP: output (u,v) -> foto (x,y),
  // omdat de warp per OUTPUT-pixel de bron bemonstert. (Eerdere versies
  // berekenden foto->output en gebruikten die achterstevoren: warp was zwart.)
  var dst=[[0,0],[W,0],[W,H],[0,H]], A=[], b=[], i;
  for(i=0;i<4;i++){
    var u=dst[i][0], v=dst[i][1], x=quad[i][0], y=quad[i][1];
    A.push([u,v,1,0,0,0,-u*x,-v*x]); b.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]); b.push(y);
  }
  return solveLin(A,b);
}
function warpToQuad(quad,W,H){
  var hh=homography(quad,W,H); if(!hh) return null;
  // v2.8 FIX: bemonsteren vanaf verkleinde canvas (max 1500px).
  // iOS Safari tekent stilletjes NIETS op canvassen boven de pixellimiet,
  // waardoor getImageData alleen nullen gaf -> "piek 0" op alle zijden.
  var nw=img.naturalWidth, nh=img.naturalHeight;
  var s=Math.min(1,2200/Math.max(nw,nh));
  var sc=document.createElement("canvas");
  sc.width=Math.max(1,Math.round(nw*s)); sc.height=Math.max(1,Math.round(nh*s));
  var sctx=sc.getContext("2d"); if(!sctx) return null;
  sctx.drawImage(img,0,0,sc.width,sc.height);
  var sd; try{ sd=sctx.getImageData(0,0,sc.width,sc.height).data; }catch(e){ return null; }
  // health check: alpha moet ergens 255 zijn, anders is er niets getekend
  var drawn=false, chk=Math.max(1,Math.floor(sc.width*sc.height/1000));
  for(var ci=3;ci<sc.width*sc.height*4;ci+=4*chk){ if(sd[ci]===255){ drawn=true; break; } }
  if(!drawn) return { canvasFail:true };
  var sw=sc.width, sh=sc.height;
  var out=new Uint8ClampedArray(W*H*4), u,v;
  for(v=0;v<H;v++) for(u=0;u<W;u++){
    var d=u*hh[6]+v*hh[7]+1;
    var sx=(u*hh[0]+v*hh[1]+hh[2])/d*s, sy=(u*hh[3]+v*hh[4]+hh[5])/d*s;
    var x0=Math.floor(sx), y0=Math.floor(sy);
    var fx=sx-x0, fy=sy-y0;
    var oi=(v*W+u)*4;
    if(x0<0||y0<0||x0>=sw-1||y0>=sh-1) continue;
    for(var ch=0;ch<3;ch++){
      var p00=sd[(y0*sw+x0)*4+ch], p10=sd[(y0*sw+x0+1)*4+ch],
          p01=sd[((y0+1)*sw+x0)*4+ch], p11=sd[((y0+1)*sw+x0+1)*4+ch];
      out[oi+ch]=(p00*(1-fx)+p10*fx)*(1-fy)+(p01*(1-fx)+p11*fx)*fy;
    }
    out[oi+3]=255;
  }
  return { data:out, w:W, h:H };
}

// ---------- Robuuste kaart-detectie ----------
function detectCard(im){
  var nw=im.naturalWidth, nh=im.naturalHeight;
  var sc=Math.min(1,600/Math.max(nw,nh));
  var w=Math.max(4,Math.round(nw*sc)), h=Math.max(4,Math.round(nh*sc));
  var c=document.createElement("canvas"); c.width=w; c.height=h;
  var ctx=c.getContext("2d"); if(!ctx) return null;
  ctx.drawImage(im,0,0,w,h);
  var d; try{ d=ctx.getImageData(0,0,w,h).data; }catch(e){ return null; }
  function px(x,y){ var i=(y*w+x)*4; return [d[i],d[i+1],d[i+2]]; }

  var mrg=Math.max(2,Math.round(Math.min(w,h)*0.025)), samp=[], xx, yy;
  for(xx=0;xx<w;xx+=2){ samp.push(px(xx,Math.floor(mrg/2))); samp.push(px(xx,h-1-Math.floor(mrg/2))); }
  for(yy=0;yy<h;yy+=2){ samp.push(px(Math.floor(mrg/2),yy)); samp.push(px(w-1-Math.floor(mrg/2),yy)); }
  function med(arr){ arr.sort(function(a,b){ return a-b; }); return arr[Math.floor(arr.length/2)]; }
  var bg=[ med(samp.map(function(s){ return s[0]; })),
           med(samp.map(function(s){ return s[1]; })),
           med(samp.map(function(s){ return s[2]; })) ];
  function bgDist(p){ return Math.abs(p[0]-bg[0])+Math.abs(p[1]-bg[1])+Math.abs(p[2]-bg[2]); }
  var vary=0; samp.forEach(function(s){ vary=Math.max(vary,bgDist(s)); });

  function tryQuad(THR){
    function isCard(x,y){ return bgDist(px(x,y))>THR; }
    var rowF=[], colF=[], y, x;
    for(y=0;y<h;y++){ var n=0; for(x=0;x<w;x++) if(isCard(x,y)) n++; rowF.push(n/w); }
    for(x=0;x<w;x++){ var m=0; for(y=0;y<h;y++) if(isCard(x,y)) m++; colF.push(m/h); }
    function fl(f){ var a=-1,b=-1; for(var i=0;i<f.length;i++) if(f[i]>0.4){ if(a<0)a=i; b=i; } return (a>=0&&b>a)?[a,b]:null; }
    var rows=fl(rowF), cols=fl(colF); if(!rows||!cols) return null;
    var run=3, lx=new Array(h).fill(null), rx=new Array(h).fill(null);
    for(y=rows[0];y<=rows[1];y++){
      for(x=cols[0];x<=cols[1]-run;x++){
        var ok=true; for(var k=0;k<run;k++) if(!isCard(x+k,y)){ ok=false; break; }
        if(ok){ lx[y]=x; break; }
      }
      for(x=cols[1];x>=cols[0]+run;x--){
        var ok2=true; for(var k2=0;k2<run;k2++) if(!isCard(x-k2,y)){ ok2=false; break; }
        if(ok2){ rx[y]=x; break; }
      }
    }
    var ty=new Array(w).fill(null), by=new Array(w).fill(null);
    for(x=cols[0];x<=cols[1];x++){
      for(y=rows[0];y<=rows[1]-run;y++){
        var ok3=true; for(var k3=0;k3<run;k3++) if(!isCard(x,y+k3)){ ok3=false; break; }
        if(ok3){ ty[x]=y; break; }
      }
      for(y=rows[1];y>=rows[0]+run;y--){
        var ok4=true; for(var k4=0;k4<run;k4++) if(!isCard(x,y-k4)){ ok4=false; break; }
        if(ok4){ by[x]=y; break; }
      }
    }
    function marge(a,b){ var m=Math.floor((b-a)*0.15); return [a+m,b-m]; }
    function collect(arr,a,b,out){
      var pts=[];
      for(var i=a;i<=b;i++) if(arr[i]!==null) pts.push(out(i,arr[i]));
      return pts;
    }
    var ra=marge(rows[0],rows[1]), ca=marge(cols[0],cols[1]);
    var leftPts=collect(lx,ra[0],ra[1],function(y,x){ return [x,y]; });
    var rightPts=collect(rx,ra[0],ra[1],function(y,x){ return [x,y]; });
    var topPts=collect(ty,ca[0],ca[1],function(xx,yy){ return [xx,yy]; });
    var botPts=collect(by,ca[0],ca[1],function(xx,yy){ return [xx,yy]; });
    // v2.9: robuuste Theil-Sen-fitting — uitschieters (zoals een verdwaald
    // randpunt rechtsboven) trekken de lijn niet meer scheef.
    function fitV(pts){ // x = a*y + b
      if(pts.length<8) return null;
      var sl=[], i, j;
      for(i=0;i<pts.length;i++) for(j=i+1;j<pts.length;j++){
        var dy=pts[j][1]-pts[i][1];
        if(Math.abs(dy)>0.5) sl.push((pts[j][0]-pts[i][0])/dy);
      }
      if(sl.length<10) return null;
      var a=med(sl);
      var ints=pts.map(function(p){ return p[0]-a*p[1]; });
      return { a:a, b:med(ints) };
    }
    function fitH(pts){ // y = a*x + b
      if(pts.length<8) return null;
      var sl=[], i, j;

    if(active){
      var p=toImg(e);
      var x=Math.min(Math.max(p[0],0),dims.w), y=Math.min(Math.max(p[1],0),dims.h);
      if(active==="top"){ rect.tl.y=y; rect.tr.y=y; }
      else if(active==="bottom"){ rect.bl.y=y; rect.br.y=y; }
      else if(active==="left"){ rect.tl.x=x; rect.bl.x=x; }
      else if(active==="right"){ rect.tr.x=x; rect.br.x=x; }
      else if(active==="it"&&inner&&inner.mode==="abs"){ inner.tl[1]=p[1]; inner.tr[1]=p[1]; }
      else if(active==="ib"&&inner&&inner.mode==="abs"){ inner.bl[1]=p[1]; inner.br[1]=p[1]; }
      else if(active=="il"&&inner&&inner.mode==="abs"){ inner.tl[0]=p[0]; inner.bl[0]=p[0]; }
      else if(active==="ir"&&inner&&inner.mode==="abs"){ inner.tr[0]=p[0]; inner.br[0]=p[0]; }
      rect.edge=null;
      drawCrop();
      return;
    }
    if(!(e.pointerId in pts)) return;
    pts[e.pointerId]=[e.clientX,e.clientY];
    var ids=Object.keys(pts);
    if(ids.length===2&&pinchP){
      var wr=wrap.getBoundingClientRect();
      var mx=(pts[ids[0]][0]+pts[ids[1]][0])/2, my=(pts[ids[0]][1]+pts[ids[1]][1])/2;
      var d=Math.hypot(pts[ids[0]][0]-pts[ids[1]][0], pts[ids[0]][1]-pts[ids[1]][1]);
      if(lastDist>0&&d>0){
        var nz=Math.min(6,Math.max(1,cropZoom.z*d/lastDist));
        cropZoom.z=nz;
        cropZoom.tx=(mx-wr.left)-nz*pinchP[0];
        cropZoom.ty=(my-wr.top)-nz*pinchP[1];
        cropApplyZoom();
      }
      lastDist=d;
    } else if(lastPan){
      cropZoom.tx+=e.clientX-lastPan[0];
      cropZoom.ty+=e.clientY-lastPan[1];
      cropApplyZoom();
      lastPan=[e.clientX,e.clientY];
    }
  });
  ["pointerup","pointercancel"].forEach(function(ev){
    svg.addEventListener(ev,function(e){
      delete pts[e.pointerId];
      if(Object.keys(pts).length<2){ lastDist=0; pinchP=null; }
      if(Object.keys(pts).length<1) lastPan=null;
      active=null;
    });
  });
}

// ---------- Centering: grijze rand meten ----------
function analyzeCentering(){
  if(!rect) return null;
  var W=340, H=Math.round(340*88/63);
  // minieme inset: meetkader 1% naar binnen zodat achtergrond-slierten buiten de kaart niet mee gemeten worden
  var q0=[[rect.tl.x,rect.tl.y],[rect.tr.x,rect.tr.y],[rect.br.x,rect.br.y],[rect.bl.x,rect.bl.y]];
  var cx0=(q0[0][0]+q0[1][0]+q0[2][0]+q0[3][0])/4, cy0=(q0[0][1]+q0[1][1]+q0[2][1]+q0[3][1])/4;
  var quad=q0.map(function(p){ return [p[0]+(cx0-p[0])*0.02, p[1]+(cy0-p[1])*0.02]; });
  var wp=warpToQuad(quad,W,H);
  if(!wp){ return { fail:true, help:"warp mislukt (homografie onoplosbaar — kaart te scheef?)",
    tTop:null,tBot:null,tLeft:null,tRight:null }; }
  if(wp.canvasFail){ return { fail:true, help:"canvas niet gevuld — foto kon niet gelezen worden (canvasFail)",
    tTop:null,tBot:null,tLeft:null,tRight:null }; }
  var data=wp.data, w=W, h=H;
  function px(x,y){ var i=(y*w+x)*4; return [data[i],data[i+1],data[i+2]]; }
  var w2=w, h2=h;
  // v2.4: adaptieve meting — geen vaste drempel, maar per zijde zelf kalibreren
  // + ruis-onderdrukking via gesmeerde gradient (buren-middeling)
  function measureSide(fromStart,horizontal){
    var len=horizontal?h:w, span=horizontal?w:h;
  var lines=[];
  var margin=Math.floor(span*0.15);
  // v2.12: binnenrand zit ALTIJD vlak achter de gele randstrook (~15% van de kaart).
  // v2.18: fysieke begrenzing — het randvlak van een standaard kaart (buitenrand +
  // kaderlijn) is nooit meer dan ~8,5% van de kaartbreedte. Metingen dieper dan
  // dat (zoals de 35px holo-glans op de Primarina) zijn dus per definitie fout
  // en vallen buiten het zoekvenster.
  var skip=Math.max(20,Math.floor(len*0.15));
  skip=Math.min(skip,Math.round(Math.min(w,h)*0.085));
  // v2.17: donkere-dip-detectie — de kaderlijn rond het artwork-venster is een
  // DONKERE lijn vlak na de lichte rand. Zoek per meetlijn de EERSTE donkere dip;
  // holo-glans dieper in het artwork kan die niet afpakken (komt pas later).
  var dips=[];
  for(var pos=margin;pos<span-margin;pos++){
      // lijn inlezen met 1px marge voor smoothing
      var pts=[], kk, dd;
      for(kk=0;kk<=skip+2;kk++){
        dd=fromStart?kk:len-1-kk;
        pts.push(horizontal?px(pos,dd):px(dd,pos));
      }
      // v2.17: eerste donkere dip (kaderlijn) zoeken
      var lum=function(p){ return 0.299*p[0]+0.587*p[1]+0.114*p[2]; };
      var runMax=lum(pts[Math.min(6,pts.length-1)]), dipK=-1;
      for(kk=6;kk<pts.length-1;kk++){
        var l=lum(pts[kk]);
        if(l<runMax*0.68&&l<190){ dipK=kk; break; }
        if(l>runMax) runMax=l;
      }
      if(dipK>0) dips.push(dipK);
      // gesmeerde gradients: verschil tussen 2px-afstand = minder ruisgevoelig
      var grads=[0,0];
      for(kk=2;kk<pts.length;kk++){
        grads.push(Math.abs(pts[kk][0]-pts[kk-2][0])+Math.abs(pts[kk][1]-pts[kk-2][1])+Math.abs(pts[kk][2]-pts[kk-2][2]));
      }
      var bestK=-1, bestG=0, cands=[], ki;
      for(ki=3;ki<Math.min(skip,grads.length-1);ki++){
        // v2.13: alle kandidaat-overgangen (lokale gradientpieken) bewaren
        if(grads[ki]>8&&grads[ki]>=grads[ki-1]&&grads[ki]>=grads[ki+1]) cands.push(ki);
        if(grads[ki]>bestG){ bestG=grads[ki]; bestK=ki; }
      }
      lines.push({ pos:pos, bestK:bestK, bestG:bestG, cands:cands });
    }
    if(lines.length===0) return null;
    // v2.17: kaderlijn-meting via dip-steun (histogram, 2px-bins)
    if(dips.length>0){
      var bins={}, bi;
      dips.forEach(function(d){ bi=Math.round(d/2)*2; bins[bi]=(bins[bi]||0)+1; });
      var bestBin=null, bestCnt=0;
      for(bi in bins) if(bins[bi]>bestCnt){ bestCnt=bins[bi]; bestBin=+bi; }
      if(bestCnt>=lines.length*0.35){
        var sel=dips.filter(function(d){ return Math.abs(d-bestBin)<=2; });
        var sum=0; sel.forEach(function(d){ sum+=d; });
        return { v:sum/sel.length, medG:0, maxG:0, skip:skip, lines:lines, method:"dip" };
      }
    }
    // terugval: v2.13-gradient-methode
    // kalibratie: mediaan van de sterkste pieken bepaalt de drempel
    var gs=lines.map(function(l){ return l.bestG; }).sort(function(a,b){ return a-b; });
    var medG=gs[Math.floor(gs.length/2)];
    var thr=Math.max(10, medG*0.5);
    var th=[], maxSeen=0;
    lines.forEach(function(l){
      if(l.bestG>maxSeen) maxSeen=l.bestG;
      if(l.bestG>=thr&&l.bestK>0) th.push(l.bestK);
    });
    if(th.length===0) return { fail:true, medG:Math.round(medG), maxG:Math.round(maxSeen), skip:skip };
    th.sort(function(a,b){ return a-b; });
    var mid=Math.floor(th.length/2);
    var val=th.length%2===1 ? th[mid] : (th[mid-1]+th[mid])/2;
    return { v:val, medG:Math.round(medG), maxG:Math.round(maxSeen), skip:skip, lines:lines };
  }
  // v2.13 pass 2: herkies per meetlijn de kandidaat-overgang die het dichtst bij
  // de verwachte randdiepte ligt (mediaan van de vier zijden). De randbreedte is
  // fysiek op alle zijden nagenoeg gelijk, dus een zijde die te diep meet
  // (tekst of glans in het artwork die sterker is dan de kaderlijn) wordt gecorrigeerd.
  function repick(r,target){
    if(!r||r.fail||!r.lines) return r;
    var picks=[];
    r.lines.forEach(function(l){
      var best=null, bd=1e9;
      (l.cands||[]).forEach(function(c){ var d2=Math.abs(c-target); if(d2<bd){ bd=d2; best=c; } });
      picks.push(best!==null?best:l.bestK);
    });
    if(picks.length===0) return r;
    picks.sort(function(a,b){ return a-b; });
    var m2=Math.floor(picks.length/2);
    r.v=picks.length%2===1?picks[m2]:(picks[m2-1]+picks[m2])/2;
    return r;
  }
  var rTop=measureSide(true,true), rBot=measureSide(false,true);
  var rLeft=measureSide(true,false), rRight=measureSide(false,false);
  // v2.13: pass 2 met kruis-validatie tussen de zijden
  // (v2.17: alleen voor gradient-metingen; dip-metingen zijn al robuust)
  var okSides=[rTop,rBot,rLeft,rRight].filter(function(r){ return r&&!r.fail; });
  if(okSides.length>=2){
    var expect=okSides.map(function(r){ return r.v; }).sort(function(a,b){ return a-b; });
    var expMed=expect[Math.floor(expect.length/2)];
    function guard(r){ return (r&&!r.fail&&r.method!=="dip")?repick(r,expMed):r; }
    rTop=guard(rTop); rBot=guard(rBot); rLeft=guard(rLeft); rRight=guard(rRight);
  }
  if(inner&&inner.user){
    // v2.42: blauwe binnenrand vast in de foto -> terugrekenen naar diktes op de kaart
    var tTop,tBot,tLeft,tRight;
    if(inner.mode==="abs"){
      var ivTL=invertQuad(inner.tl[0],inner.tl[1]), ivTR=invertQuad(inner.tr[0],inner.tr[1]),
          ivBL=invertQuad(inner.bl[0],inner.bl[1]), ivBR=invertQuad(inner.br[0],inner.br[1]);
      var vT=(ivTL[1]+ivTR[1])/2, vB=(ivBL[1]+ivBR[1])/2, uL=(ivTL[0]+ivBL[0])/2, uR=(ivTR[0]+ivBR[0])/2;
      tTop=Math.max(1,Math.min(H*0.45,vT*H));
      tBot=Math.max(1,Math.min(H*0.45,(1-vB)*H));
      tLeft=Math.max(1,Math.min(W*0.45,uL*W));
      tRight=Math.max(1,Math.min(W*0.45,(1-uR)*W));
    } else {
      tTop=Math.min(H*0.45,inner.t*H); tBot=Math.min(H*0.45,inner.b*H);
      tLeft=Math.min(W*0.45,inner.l*W); tRight=Math.min(W*0.45,inner.r*W);
    }
  } else {
    if(!rTop||!rBot||!rLeft||!rRight||rTop.fail||rBot.fail||rLeft.fail||rRight.fail){
      return { fail:true, tTop:rTop, tBot:rBot, tLeft:rLeft, tRight:rRight,
        help:"piek-mediaan per zijde: top "+diag(rTop)+", onder "+diag(rBot)+", links "+diag(rLeft)+", rechts "+diag(rRight) };
    }
    var tTop=rTop.v, tBot=rBot.v, tLeft=rLeft.v, tRight=rRight.v;
  }

  var midTop=tTop/2, midBot=h-tBot/2, midLeft=tLeft/2, midRight=w-tRight/2;
  var cx=w/2, cy=h/2;
  var offX=((midRight-cx)-(cx-midLeft));
  var offY=((midBot-cy)-(cy-midTop));
  var devLR=Math.abs(offX)/w*100, devTB=Math.abs(offY)/h*100;

  function fmt(p,q){ var t=Math.round(p*10)/10,u=Math.round(q*10)/10; return Math.max(t,u).toFixed(1)+"/"+Math.min(t,u).toFixed(1); }
  var maxDev=Math.max(devLR,devTB);
  var grade=10;
  if(maxDev>6) grade=6; else if(maxDev>4) grade=7; else if(maxDev>2.5) grade=8; else if(maxDev>1.2) grade=9; else if(maxDev>0.4) grade=9.5;
  var notes=[ "Randdikte boven/onder: "+(Math.round(tTop*10)/10)+"px / "+(Math.round(tBot*10)/10)+"px  ("+fmt(tTop,tBot)+")",
          "Randdikte links/rechts: "+(Math.round(tLeft*10)/10)+"px / "+(Math.round(tRight*10)/10)+"px  ("+fmt(tLeft,tRight)+")",
          "Middenafwijking links-rechts: "+(Math.round(devLR*100)/100)+"%"+(offX>0?" (rand rechts dikker)":" (rand links dikker)"),
          "Middenafwijking boven-onder: "+(Math.round(devTB*100)/100)+"%"+(offY>0?" (rand onder dikker)":" (rand boven dikker)") ];
  if(grade>=9.5) notes.push("Praktisch perfect gecenterd 🎉");
  else if(grade>=9) notes.push("Goed gecenterd — scoort doorgaans 9-10 bij grading.");
  else if(grade>=8) notes.push("Acceptabel gecenterd, kans op 8-9.");
  else notes.push("Zichtbaar off-center — beïnvloedt de grade flink.");

  var vc=document.createElement("canvas"); vc.width=w; vc.height=h;
  var vctx=vc.getContext("2d");
  var id=vctx.createImageData(w,h);
  for(var ii=0;ii<data.length;ii++) id.data[ii]=data[ii];
  vctx.putImageData(id,0,0);
  // v2.14: hi-res warp (2x) alleen voor de weergave -> geen wazige kaart
  var wpHi=warpToQuad(quad,w*2,h*2), imgHref=null;
  if(wpHi&&wpHi.data&&!wpHi.canvasFail){
    var vcHi=document.createElement("canvas"); vcHi.width=w*2; vcHi.height=h*2;
    var vctxHi=vcHi.getContext("2d"); var idHi=vctxHi.createImageData(w*2,h*2);
    for(var ij=0;ij<wpHi.data.length;ij++) idHi.data[ij]=wpHi.data[ij];
    vctxHi.putImageData(idHi,0,0);
    imgHref=vcHi.toDataURL("image/png");
  }
  if(!imgHref) imgHref=vc.toDataURL("image/png");
  var vis='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block">'
    +'<image href="'+imgHref+'" x="0" y="0" width="'+w+'" height="'+h+'"/>'
    +'<rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'" fill="none" stroke="#facc15" stroke-width="2"/>'
    +'<rect x="'+tLeft+'" y="'+tTop+'" width="'+(w-tLeft-tRight)+'" height="'+(h-tTop-tBot)+'" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="5 4"/>'
    +'<line x1="'+cx+'" y1="0" x2="'+cx+'" y2="'+h+'" stroke="#f87171" stroke-width="1" stroke-dasharray="3 5"/>'
    +'<line x1="0" y1="'+cy+'" x2="'+w+'" y2="'+cy+'" stroke="#f87171" stroke-width="1" stroke-dasharray="3 5"/>'
    +'<circle cx="'+midLeft+'" cy="'+cy+'" r="4" fill="#38bdf8"/>'
    +'<circle cx="'+midRight+'" cy="'+cy+'" r="4" fill="#38bdf8"/>'
    +'<circle cx="'+cx+'" cy="'+midTop+'" r="4" fill="#38bdf8"/>'
    +'<circle cx="'+cx+'" cy="'+midBot+'" r="4" fill="#38bdf8"/>'
    +'</svg>';
  var tc=document.createElement("canvas"); tc.width=68; tc.height=Math.round(68*h/w*1);
  tc.width=68; tc.height=Math.round(68*(h/w));
  tc.getContext("2d").drawImage(vc,0,0,tc.width,tc.height);
  var thumb=tc.toDataURL("image/jpeg",0.5);
  // v2.15: grotere preview voor de detail-weergave (300px breed)
  var pc=document.createElement("canvas"); pc.width=300; pc.height=Math.round(300*(h/w));
  pc.getContext("2d").drawImage(vc,0,0,pc.width,pc.height);
  var big=pc.toDataURL("image/jpeg",0.75);
  return { grade:grade, notes:notes, vis:vis, thumb:thumb, big:big, devLR:devLR, devTB:devTB,
           tTop:tTop, tBot:tBot, tLeft:tLeft, tRight:tRight };
}

function gradeColor(g){ return g>=9.5?"#22c55e":g>=9?"#84cc16":g>=8?"#eab308":"#f97316"; }

// ---------- v2.25: kaart opzoeken via de officiële Pokémon TCG API ----------
function lookupCard(){
  var el=document.getElementById("lookupResult");
  var inp=document.getElementById("lookupName");
  if(!el||!inp) return;
  var q=inp.value.trim();
  if(!q){ el.innerHTML='<div class="note">Typ eerst een kaartnaam.</div>'; return; }
  el.innerHTML='<div class="note">⏳ Zoeken naar "'+q+'"…</div>';
  tcgFetch("https://api.pokemontcg.io/v2/cards?q=name:"+encodeURIComponent(q)+"&pageSize=8")
    .then(function(j){
      var cards=(j&&j.data)||[];
      if(cards.length===0){
        el.innerHTML='<div class="note">❌ Geen kaart gevonden voor "'+q+'". Controleer de spelling (Engelse naam, bijv. "Pikachu").</div>';
        return;
      }
      var html="";
      cards.forEach(function(c,i){
        var price=null;
        if(c.tcgplayer&&c.tcgplayer.prices){
          for(var k in c.tcgplayer.prices){
            if(c.tcgplayer.prices[k].market){ price=c.tcgplayer.prices[k].market; break; }
          }
        }
        html+='<div class="lookupItem" onclick="pickCard('+i+')">'
          +(c.images&&c.images.small?'<img src="'+c.images.small+'" alt="">':'')
          +'<div class="si"><div style="font-weight:700;color:#e2e8f0">'+(c.name||"")+'</div>'
          +'<div class="sd">'+((c.set&&c.set.name)||"")+' · '+(c.number||"?")+'</div>'
+(price?'<div class="sd" style="color:#84cc16">waarde ≈ $'
+price+'</div>':'<div class="sd">geen prijs bekend</div>')
          +'</div></div>';
      });
      el.innerHTML=html;
      window._lookupCards=cards;
    })
    .catch(function(err){
      el.innerHTML='<div class="note">❌ Zoeken mislukt: '+(err&&err.message?err.message:"onbekende fout")+'</div>';
    });
}
function pickCard(i){
  var c=(window._lookupCards||[])[i];
  if(!c) return;
  var el=document.getElementById("lookupResult");
  if(!el) return;
  var price=null;
  if(c.tcgplayer&&c.tcgplayer.prices){
    for(var k in c.tcgplayer.prices){ if(c.tcgplayer.prices[k].market){ price=c.tcgplayer.prices[k].market; break; } }
  }
  el.innerHTML='<div class="lookupPick">'
    +(c.images&&c.images.large?'<img src="'+c.images.large+'" alt="'+(c.name||"")+'">':'')
    +'<div><b style="color:#e2e8f0">'+(c.name||"")+'</b>'
    +'<div class="sd">'+((c.set&&c.set.name)||"")+' · '+(c.number||"?")+(c.rarity?' · '+c.rarity:'')+'</div>'
+(price?'<div class="sd" style="color:#84cc16">marktprijs ≈ $'
+price+'</div>':'')
    +'</div></div>';
  // gevonden kaart bij de scan opslaan
  try{
    var scans=getScans();
    for(var s2=0;s2<scans.length;s2++){
      if(scans[s2].id===currentScanId){
        scans[s2].cn=c.name||""; scans[s2].cs=(c.set&&c.set.name)||"";
        scans[s2].cno=c.number||""; scans[s2].cp=price;
        scans[s2].ci=(c.images&&c.images.small)||"";
        localStorage.setItem("mcScans", JSON.stringify(scans));
        break;
      }
    }
  }catch(e){}
}

// ---------- v2.28: automatische kaartherkenning via OCR (Tesseract.js) ----------
function loadTesseract(cb){
  if(window.Tesseract){ cb(); return; }
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
  s.onload=cb;
  s.onerror=function(){ var el=document.getElementById("lookupResult"); if(el) el.innerHTML='<div class="note">❌ OCR-engine kon niet laden (geen internet?).</div>'+manualFieldHTML(""); };
  document.head.appendChild(s);
}
function ocrRegion(quad, rx, ry, rw, rh, scale){
  // warp de kaart op hoge resolutie en knip een regio (fracties van de kaart) uit
  var W=340, H=Math.round(340*88/63);
  var bigW=Math.round(W*scale), bigH=Math.round(H*scale);
  var wp=warpToQuad(quad, bigW, bigH);
  if(!wp||wp.canvasFail||!wp.data) return null;
  var full=document.createElement("canvas"); full.width=bigW; full.height=bigH;
  var fctx=full.getContext("2d");
  var id=fctx.createImageData(bigW,bigH);
  for(var i=0;i<wp.data.length;i++) id.data[i]=wp.data[i];
  fctx.putImageData(id,0,0);
  var c=document.createElement("canvas");
  c.width=Math.round(bigW*rw); c.height=Math.round(bigH*rh);
  if(c.width<8||c.height<8) return null;
  var ctx=c.getContext("2d");
  ctx.drawImage(full, Math.round(bigW*rx), Math.round(bigH*ry), c.width, c.height, 0, 0, c.width, c.height);
  // 3x vergroten voor betere OCR
  var up=document.createElement("canvas"); up.width=c.width*3; up.height=c.height*3;
  var uctx=up.getContext("2d"); uctx.imageSmoothingEnabled=true;
  uctx.drawImage(c,0,0,up.width,up.height);
  return up;
}
// v2.36: binariseren (zwart-wit) - vooral voor het kleine kaartnummer groot winst
function ocrBinarize(cv){
  var out=document.createElement("canvas"); out.width=cv.width; out.height=cv.height;
  var ctx=out.getContext("2d"); ctx.drawImage(cv,0,0);
  try{
    var d=ctx.getImageData(0,0,out.width,out.height);
    // luminantie-histogram, midden als drempel (Otsu-licht)
    var hist=new Array(256).fill(0), i;
    for(i=0;i<d.data.length;i+=4){
      var l=Math.round(0.299*d.data[i]+0.587*d.data[i+1]+0.114*d.data[i+2]);
      hist[l]++;
    }
    var tot=out.width*out.height, sum=0;
    for(i=0;i<256;i++) sum+=i*hist[i];
    var sumB=0, wB=0, best=128, bestVar=-1;
    for(i=0;i<256;i++){
      wB+=hist[i]; if(wB===0) continue;
      var wF=tot-wB; if(wF===0) break;

function tcgFetch(url,retries){
  retries=retries||0;
  var headers={};
  var key=null; try{ key=localStorage.getItem("tcgKey"); }catch(e){}
  if(key) headers["X-API-Key"]=key;
  return fetch(url,{headers:headers}).then(function(r){
    if(!r.ok){
      return r.text().catch(function(){ return ""; }).then(function(t){
        if((r.status===429||r.status>=500)&&retries<2){

function normNum(s){ return String(s||"").replace(/^0+/,""); }
function tcgdexSearch(name, cb){
  var w=(name.split(" ")[0]||name);
  var queries=[name]; if(w&&w.toLowerCase()!==name.toLowerCase()) queries.push(w);
  function doQuery(q, done){
    fetch("https://api.tcgdex.net/v2/en/cards?name="+encodeURIComponent(q))
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(j){ done(Array.isArray(j)?j:[]); })
      .catch(function(){ done(null); });
  }
  function step(i){
    if(i>=queries.length){ cb(null); return; }
    doQuery(queries[i], function(list){
      if(list===null){ cb(null); return; }
      if(list.length>0){ cb(list); return; }
      step(i+1);
    });
  }
  step(0);
}
function tcgdexDetail(brief, cb){

    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(card){ cb(card||null); })

    +res.notes.map(function(n){ return '<p class="n">'+n+'</p>'; }).join("")
    +'<div id="lookupResult"></div>'
    +'</div>';
  attachZoom();
  saveScan(res);
  showView("resultView");
  autoCardLookup();
  }catch(e){ // v2.45
    var elE=document.getElementById("resultScroll");
    if(elE) elE.innerHTML='<div class="note">⚠️ Interne fout bij het analyseren: '+((e&&e.message)||e)+' — kopieer deze regel en stuur hem in de chat (v'+VERSION+').</div>';
    showView("resultView");
  }
}

// ---------- Zoom op de analyse-visualisatie ----------
var zs=1;
function setZoom(s, ax, ay){
  var wrap=document.getElementById("zoomWrap"), inner=document.getElementById("zoomInner");
  if(!wrap||!inner) return;
  // v2.39: zoom vanuit het MIDDEN (of het ankerpunt van je knijpgebare).
  // Het punt onder het anker blijft op zijn plek in beeld — niet meer
  // alles vanaf linksboven uitrekken.
  if(ax===undefined||ax===null){ ax=wrap.clientWidth/2; ay=wrap.clientHeight/2; }
  var cx=(wrap.scrollLeft+ax)/zs, cy=(wrap.scrollTop+ay)/zs;
  zs=Math.min(6,Math.max(0.5,s));
  inner.style.width="100%";
  inner.style.transform="scale("+zs+")";
  wrap.scrollLeft=cx*zs-ax;
  wrap.scrollTop=cy*zs-ay;
}
function attachZoom(){
  var wrap=document.getElementById("zoomWrap"); if(!wrap) return;
  var pts={}, lastDist=0, lastPan=null, lastTap=0;
  wrap.onpointerdown=function(e){
    e.preventDefault();
    pts[e.pointerId]=[e.clientX,e.clientY];
    try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
    if(Object.keys(pts).length===1){
      var now=Date.now();
      if(now-lastTap<300){
        var wr0=wrap.getBoundingClientRect();
        setZoom(zs>1.4?1:2.5, e.clientX-wr0.left, e.clientY-wr0.top);
      }
      lastTap=now;
      lastPan=[e.clientX,e.clientY];
    }
  };
  wrap.onpointermove=function(e){
    if(!(e.pointerId in pts)) return;
    pts[e.pointerId]=[e.clientX,e.clientY];
    var ids=Object.keys(pts);
    if(ids.length===2){
      var wr1=wrap.getBoundingClientRect();
      var mx=(pts[ids[0]][0]+pts[ids[1]][0])/2, my=(pts[ids[0]][1]+pts[ids[1]][1])/2;
      var d=Math.hypot(pts[ids[0]][0]-pts[ids[1]][0], pts[ids[0]][1]-pts[ids[1]][1]);
      if(lastDist>0) setZoom(zs*d/lastDist, mx-wr1.left, my-wr1.top);
      lastDist=d;
      lastPan=null;
    } else if(lastPan){
      wrap.scrollLeft-=(e.clientX-lastPan[0]);
      wrap.scrollTop-=(e.clientY-lastPan[1]);
      lastPan=[e.clientX,e.clientY];
    }
  };
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    wrap.addEventListener(ev,function(e){
      delete pts[e.pointerId];
      if(Object.keys(pts).length<2) lastDist=0;
      lastPan=null;
    });
  });
  setZoom(1);
}

// ---------- Scan-database (lokaal opgeslagen op deze iPhone) ----------
function getScans(){
  try{ return JSON.parse(localStorage.getItem("mcScans")||"[]"); }catch(e){ return []; }
}
function saveScan(res){
  try{
    var scans=getScans();
    var id=Date.now();
    scans.unshift({ id:id, d:new Date().toLocaleString("nl-NL"), g:res.grade,
      lr:Math.round(res.devLR*100)/100, tb:Math.round(res.devTB*100)/100,
      tT:Math.round(res.tTop*10)/10, tB:Math.round(res.tBot*10)/10,
      tL:Math.round(res.tLeft*10)/10, tR:Math.round(res.tRight*10)/10,
      t:res.thumb, b:res.big||null, vs:res.vs||null });
    if(scans.length>200) scans=scans.slice(0,200);
    try{ localStorage.setItem("mcScans", JSON.stringify(scans)); }
    catch(e2){
      // opslag vol: opnieuw zonder de grote visuals
      scans=scans.map(function(s){ return { id:s.id, d:s.d, g:s.g, lr:s.lr, tb:s.tb, tT:s.tT, tB:s.tB, tL:s.tL, tR:s.tR, t:s.t }; });
      try{ localStorage.setItem("mcScans", JSON.stringify(scans)); }catch(e3){}
    }
    currentScanId=id;
  }catch(e){}
}
var currentScanId=null;
function delScan(i){
  var scans=getScans(); scans.splice(i,1);
  try{ localStorage.setItem("mcScans", JSON.stringify(scans)); }catch(e){}
  renderHistory();
}
function clearScans(){
  if(!confirm("Alle opgeslagen scans wissen?")) return;
  try{ localStorage.removeItem("mcScans"); }catch(e){}
  renderHistory();
}
function renderHistory(){
  var scans=getScans(), el=document.getElementById("histScroll"), html="";
  if(scans.length===0){
    html='<div class="note" style="margin-top:16px">Nog geen gescande kaarten. Maak een foto en analyseer hem — daarna verschijnt hij hier automatisch in je collectie.</div>';
  } else {
    var sum=0, best=scans[0], worst=scans[0];
    scans.forEach(function(s){ sum+=s.g; if(s.g>best.g) best=s; if(s.g<worst.g) worst=s; });
    var avg=Math.round(sum/scans.length*10)/10;
    var val=0, nP=0; scans.forEach(function(s){ if(s.cp){ val+=s.cp; nP++; } });
    function gColor(g){ return gradeColor(g); }
    html+='<div class="card"><div class="score"><span>Rapport — '+scans.length+' kaart'+(scans.length===1?"":"en")+'</span></div>'
      +'<div class="bar"><div style="width:'+(avg*10)+'%;background:'+gColor(avg)+'"></div></div>'
      +'<p class="n">📊 Gemiddelde centering score: <b style="color:'+gColor(avg)+'">'+avg+'</b></p>'
      +'<p class="n">🏆 Beste: '+best.g+' ('+best.d+')</p>'
      +'<p class="n">⚠️ Slechtste: '+worst.g+' ('+worst.d+')</p>'+(nP>0?'<p class="n">💰 Bekende marktprijs samen: &#36;'+(Math.round(val*100)/100)+' — '+nP+' kaart'+(nP===1?'':'en')+' met prijs</p>':'')+'</div>';
    scans.forEach(function(s,i){
      html+='<div class="scanItem" onclick="showScanDetail('+i+')">'
        +'<img src="'+(s.t||"")+'" alt="scan">'
        +'<div class="si"><div class="sd">'+s.d+'</div>'
        +'<div class="sg" style="color:'+gColor(s.g)+'">'+s.g+'</div>'
        +'<div class="sd">afw. LR '+s.lr+'% · TB '+s.tb+'%</div></div>'
        +'<button onclick="event.stopPropagation();delScan('+i+')">✕</button></div>';
    });
  }
  el.innerHTML=html;
  showView("historyView");
}
// v2.15: detailweergave van één scan
function showScanDetail(i){
  var s=getScans()[i];
  if(!s) return;
  var el=document.getElementById("detailScroll");
  var html='<div class="card">'
    +'<div class="score"><span>'+s.d+'</span><b style="color:'+gradeColor(s.g)+'">'+s.g+'</b></div>'
    +((s.cn)?'<p class="n" style="font-size:15px;color:#e2e8f0;font-weight:700;margin:2px 0 2px">🃏 '+s.cn+((s.cs)?' — '+s.cs:'')+((s.cno)?' #'+s.cno:'')+'</p>'
      +(s.cp?'<p class="n" style="margin:2px 0 6px;color:#84cc16">marktprijs: &#36;'+s.cp+'</p>':''):'');
  if(s.vs){
    html+=s.vs;
  } else if(s.b){
    html+='<img src="'+s.b+'" alt="kaart" style="width:100%;border-radius:10px;margin:8px 0;display:block">';
  } else {
    html+='<div class="note">Weergave niet opgeslagen bij deze scan (gemaakt vóór v2.22) — scan opnieuw voor de visualisatie.</div>';
  }
  html+='<p class="n">Randdikte boven: '+s.tT+'px &nbsp;·&nbsp; onder: '+s.tB+'px</p>'
    +'<p class="n">Randdikte links: '+s.tL+'px &nbsp;·&nbsp; rechts: '+s.tR+'px</p>'
    +'<p class="n">Middenafwijking links-rechts: '+s.lr+'%</p>'
    +'<p class="n">Middenafwijking boven-onder: '+s.tb+'%</p>';
  if(s.g>=9.5) html+='<p class="n">Praktisch perfect gecenterd 🎉</p>';
  else if(s.g>=9) html+='<p class="n">Goed gecenterd — scoort doorgaans 9-10 bij grading.</p>';
  else if(s.g>=8) html+='<p class="n">Acceptabel gecenterd, kans op 8-9.</p>';
  else html+='<p class="n">Zichtbaar off-center — beïnvloedt de grade flink.</p>';
  html+='</div>';
  el.innerHTML=html;
  showView("detailView");
}
function exportCSV(){
  var scans=getScans();
  if(scans.length===0){ alert("Nog geen scans om te exporteren."); return; }
  var csv="datum;tijd;score;afwijking_LR_%;afwijking_TB_%;rand_boven_px;rand_onder_px;rand_links_px;rand_rechts_px\n";
  scans.forEach(function(s){
    var dt=s.d.split(", ");
    csv+=[dt[0]||s.d, dt[1]||"", s.g, s.lr, s.tb, s.tT, s.tB, s.tL, s.tR].join(";")+"\n";
  });
  window.open("data:text/csv;charset=utf-8,"+encodeURIComponent(csv));
}
