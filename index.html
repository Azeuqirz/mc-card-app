<script>
"use strict";
var VERSION="2.12";
var img=null, rect=null, dims=null;

function showView(id){

  document.getElementById(id).classList.add("active");
}

function bindFile(id, cb){

  el.addEventListener("change", function(e){
    var f=e.target.files && e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){ cb(rd.result); };
    rd.readAsDataURL(f);
    e.target.value="";
  });
}
bindFile("fileInput", loadPhoto);

function loadPhoto(dataUrl){
  var ci=document.getElementById("cropImg"); ci.src=dataUrl;
  ci.onload=function(){ img=ci; showView("scan"); autoDetect(); };
}

// ---------- Lineaire algebra ----------
function solveLin(A,b){
  var n=b.length, M=A.map(function(r,i){ return r.concat([b[i]]); }), i,k,j;
  for(i=0;i<n;i++){
    var piv=i;
    for(k=i+1;k<n;k++) if(Math.abs(M[k][i])>Math.abs(M[piv][i])) piv=k;
    if(Math.abs(M[piv][i])<1e-9) return null;
    var t=M[i]; M[i]=M[piv]; M[piv]=t;
    for(k=i+1;k<n;k++){
      var f=M[k][i]/M[i][i];
      for(j=i;j<=n;j++) M[k][j]-=f*M[i][j];
    }
  }
  var x=new Array(n);
  for(i=n-1;i>=0;i--){
    var s=M[i][n];
    for(j=i+1;j<n;j++) s-=M[i][j]*x[j];
    x[i]=s/M[i][i];
  }
  return x;
}
function homography(quad,W,H){
  // v2.7 FIX: stelsel omgekeerd — we lossen OP: output (u,v) -> foto (x,y),
  // omdat de warp per OUTPUT-pixel de bron bemonstert. (Eerdere versies
  // berekenden foto->output en gebruikten die achterstevoren: warp was zwart.)
  var dst=[[0,0],[W,0],[W,H],[0,H]], A=[], b=[], i;
  for(i=0;i<4;i++){
    var u=dst[i][0], v=dst[i][1], x=quad[i][0], y=quad[i][1];
    A.push([u,v,1,0,0,0,-u*x,-v*x]); b.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]); b.push(y);
  }
  return solveLin(A,b);
}
function warpToQuad(quad,W,H){
  var hh=homography(quad,W,H); if(!hh) return null;
  // v2.8 FIX: bemonsteren vanaf verkleinde canvas (max 1500px).
  // iOS Safari tekent stilletjes NIETS op canvassen boven de pixellimiet,
  // waardoor getImageData alleen nullen gaf -> "piek 0" op alle zijden.
  var nw=img.naturalWidth, nh=img.naturalHeight;
  var s=Math.min(1,1500/Math.max(nw,nh));
  var sc=document.createElement("canvas");
  sc.width=Math.max(1,Math.round(nw*s)); sc.height=Math.max(1,Math.round(nh*s));
  var sctx=sc.getContext("2d"); if(!sctx) return null;
  sctx.drawImage(img,0,0,sc.width,sc.height);
  var sd; try{ sd=sctx.getImageData(0,0,sc.width,sc.height).data; }catch(e){ return null; }
  // health check: alpha moet ergens 255 zijn, anders is er niets getekend
  var drawn=false, chk=Math.max(1,Math.floor(sc.width*sc.height/1000));
  for(var ci=3;ci<sc.width*sc.height*4;ci+=4*chk){ if(sd[ci]===255){ drawn=true; break; } }
  if(!drawn) return { canvasFail:true };
  var sw=sc.width, sh=sc.height;
  var out=new Uint8ClampedArray(W*H*4), u,v;
  for(v=0;v<H;v++) for(u=0;u<W;u++){
    var d=u*hh[6]+v*hh[7]+1;
    var sx=(u*hh[0]+v*hh[1]+hh[2])/d*s, sy=(u*hh[3]+v*hh[4]+hh[5])/d*s;
    var x0=Math.floor(sx), y0=Math.floor(sy);
    var fx=sx-x0, fy=sy-y0;
    var oi=(v*W+u)*4;
    if(x0<0||y0<0||x0>=sw-1||y0>=sh-1) continue;
    for(var ch=0;ch<3;ch++){
      var p00=sd[(y0*sw+x0)*4+ch], p10=sd[(y0*sw+x0+1)*4+ch],
          p01=sd[((y0+1)*sw+x0)*4+ch], p11=sd[((y0+1)*sw+x0+1)*4+ch];
      out[oi+ch]=(p00*(1-fx)+p10*fx)*(1-fy)+(p01*(1-fx)+p11*fx)*fy;
    }
    out[oi+3]=255;
  }
  return { data:out, w:W, h:H };
}

// ---------- Robuuste kaart-detectie ----------
function detectCard(im){
  var nw=im.naturalWidth, nh=im.naturalHeight;
  var sc=Math.min(1,600/Math.max(nw,nh));
  var w=Math.max(4,Math.round(nw*sc)), h=Math.max(4,Math.round(nh*sc));
  var c=document.createElement("canvas"); c.width=w; c.height=h;
  var ctx=c.getContext("2d"); if(!ctx) return null;
  ctx.drawImage(im,0,0,w,h);
  var d; try{ d=ctx.getImageData(0,0,w,h).data; }catch(e){ return null; }
  function px(x,y){ var i=(y*w+x)*4; return [d[i],d[i+1],d[i+2]]; }

  var mrg=Math.max(2,Math.round(Math.min(w,h)*0.025)), samp=[], xx, yy;
  for(xx=0;xx<w;xx+=2){ samp.push(px(xx,Math.floor(mrg/2))); samp.push(px(xx,h-1-Math.floor(mrg/2))); }
  for(yy=0;yy<h;yy+=2){ samp.push(px(Math.floor(mrg/2),yy)); samp.push(px(w-1-Math.floor(mrg/2),yy)); }
  function med(arr){ arr.sort(function(a,b){ return a-b; }); return arr[Math.floor(arr.length/2)]; }
  var bg=[ med(samp.map(function(s){ return s[0]; })),
           med(samp.map(function(s){ return s[1]; })),
           med(samp.map(function(s){ return s[2]; })) ];
  function bgDist(p){ return Math.abs(p[0]-bg[0])+Math.abs(p[1]-bg[1])+Math.abs(p[2]-bg[2]); }
  var vary=0; samp.forEach(function(s){ vary=Math.max(vary,bgDist(s)); });

  function tryQuad(THR){
    function isCard(x,y){ return bgDist(px(x,y))>THR; }
    var rowF=[], colF=[], y, x;
    for(y=0;y<h;y++){ var n=0; for(x=0;x<w;x++) if(isCard(x,y)) n++; rowF.push(n/w); }
    for(x=0;x<w;x++){ var m=0; for(y=0;y<h;y++) if(isCard(x,y)) m++; colF.push(m/h); }
    function fl(f){ var a=-1,b=-1; for(var i=0;i<f.length;i++) if(f[i]>0.4){ if(a<0)a=i; b=i; } return (a>=0&&b>a)?[a,b]:null; }
    var rows=fl(rowF), cols=fl(colF); if(!rows||!cols) return null;
    var run=3, lx=new Array(h).fill(null), rx=new Array(h).fill(null);
    for(y=rows[0];y<=rows[1];y++){
      for(x=cols[0];x<=cols[1]-run;x++){
        var ok=true; for(var k=0;k<run;k++) if(!isCard(x+k,y)){ ok=false; break; }
        if(ok){ lx[y]=x; break; }
      }
      for(x=cols[1];x>=cols[0]+run;x--){
        var ok2=true; for(var k2=0;k2<run;k2++) if(!isCard(x-k2,y)){ ok2=false; break; }
        if(ok2){ rx[y]=x; break; }
      }
    }
    var ty=new Array(w).fill(null), by=new Array(w).fill(null);
    for(x=cols[0];x<=cols[1];x++){
      for(y=rows[0];y<=rows[1]-run;y++){
        var ok3=true; for(var k3=0;k3<run;k3++) if(!isCard(x,y+k3)){ ok3=false; break; }
        if(ok3){ ty[x]=y; break; }
      }
      for(y=rows[1];y>=rows[0]+run;y--){
        var ok4=true; for(var k4=0;k4<run;k4++) if(!isCard(x,y-k4)){ ok4=false; break; }
        if(ok4){ by[x]=y; break; }
      }
    }
    function marge(a,b){ var m=Math.floor((b-a)*0.15); return [a+m,b-m]; }
    function collect(arr,a,b,out){
      var pts=[];
      for(var i=a;i<=b;i++) if(arr[i]!==null) pts.push(out(i,arr[i]));
      return pts;
    }
    var ra=marge(rows[0],rows[1]), ca=marge(cols[0],cols[1]);
    var leftPts=collect(lx,ra[0],ra[1],function(y,x){ return [x,y]; });
    var rightPts=collect(rx,ra[0],ra[1],function(y,x){ return [x,y]; });
    var topPts=collect(ty,ca[0],ca[1],function(xx,yy){ return [xx,yy]; });
    var botPts=collect(by,ca[0],ca[1],function(xx,yy){ return [xx,yy]; });
    // v2.9: robuuste Theil-Sen-fitting — uitschieters (zoals een verdwaald
    // randpunt rechtsboven) trekken de lijn niet meer scheef.
    function fitV(pts){ // x = a*y + b
      if(pts.length<8) return null;
      var sl=[], i, j;
      for(i=0;i<pts.length;i++) for(j=i+1;j<pts.length;j++){
        var dy=pts[j][1]-pts[i][1];
        if(Math.abs(dy)>0.5) sl.push((pts[j][0]-pts[i][0])/dy);
      }
      if(sl.length<10) return null;
      var a=med(sl);
      var ints=pts.map(function(p){ return p[0]-a*p[1]; });
      return { a:a, b:med(ints) };
    }
    function fitH(pts){ // y = a*x + b
      if(pts.length<8) return null;
      var sl=[], i, j;
      for(i=0;i<pts.length;i++) for(j=i+1;j<pts.length;j++){
        var dx=pts[j][0]-pts[i][0];
        if(Math.abs(dx)>0.5) sl.push((pts[j][1]-pts[i][1])/dx);
      }
      if(sl.length<10) return null;
      var a=med(sl);
      var ints=pts.map(function(p){ return p[1]-a*p[0]; });
      return { a:a, b:med(ints) };
    }
    var L=fitV(leftPts), R=fitV(rightPts), T=fitH(topPts), B=fitH(botPts);
    if(!L||!R||!T||!B) return null;
    // v2.10: randverfijning — zoek per zijde de sterkste kleurovergang (de echte
    // kaart/achtergrond-grens) in een venster rond de gefitte lijn. Een drempel-
    // detectie kan achtergrond (lichte band, schaduw) ten onrechte als kaart
    // tellen; de gradiënt-piek ligt altijd op de echte rand.
    function gradX(x,y){ if(x<1||x>w-2||y<0||y>=h) return 0; var a=px(x-1,y), b=px(x+1,y); return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]); }
    function gradY(x,y){ if(y<1||y>h-2||x<0||x>=w) return 0; var a=px(x,y-1), b=px(x,y+1); return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]); }
    function midRange(a,b){
      var s=[], step=Math.max(1,Math.floor((b-a)/60));
      for(var i=Math.floor(a+(b-a)*0.15);i<=Math.floor(a+(b-a)*0.85);i+=step) s.push(i);
      return s;
    }
    function refineSide(fit, along, gradAt, offMin, offMax, vertical){
      if(!fit) return null;
      var peaks=[], i;
      for(i=0;i<along.length;i++){
        var pos=along[i];
        var c=Math.round(fit.a*pos+fit.b), cc, g, maxG=0;
        for(cc=c+offMin;cc<=c+offMax;cc++){ g=gradAt(cc,pos); if(g>maxG) maxG=g; }
        if(maxG<15) continue;
        var thr=maxG*0.6, pick=-1;
        if(offMax<=10){
          // buitenkant = hogere cc: van buiten naar binnen (aflopend) scannen
          for(cc=c+offMax;cc>=c+offMin;cc--){ if(gradAt(cc,pos)>=thr){ pick=cc; break; } }
        } else {
          // buitenkant = lagere cc: van buiten naar binnen (oplopend) scannen
          for(cc=c+offMin;cc<=c+offMax;cc++){ if(gradAt(cc,pos)>=thr){ pick=cc; break; } }
        }
        if(pick>=0) peaks.push({ c:pick, pos:pos, g:maxG });
      }
      if(peaks.length<8) return null;
      var pts=peaks.map(function(p){ return vertical ? [p.c,p.pos] : [p.pos,p.c]; });
      return vertical ? fitV(pts) : fitH(pts);
    }
    var ys=midRange(rows[0],rows[1]), xs=midRange(cols[0],cols[1]);
    L=refineSide(L, ys, function(cc,pos){ return gradX(cc,pos); }, -10, 35, true) || L;
    R=refineSide(R, ys, function(cc,pos){ return gradX(cc,pos); }, -35, 10, true) || R;
    T=refineSide(T, xs, function(cc,pos){ return gradY(pos,cc); }, -10, 35, false) || T;
    B=refineSide(B, xs, function(cc,pos){ return gradY(pos,cc); }, -35, 10, false) || B;
    function ix(v,hh){
      var den=1-v.a*hh.a;
      if(Math.abs(den)<1e-6) return null;
      var xq=(v.a*hh.b+v.b)/den;
      return [xq, hh.a*xq+hh.b];
    }
    var TL=ix(L,T), TR=ix(R,T), BR=ix(R,B), BL=ix(L,B);
    if(!TL||!TR||!BR||!BL) return null;
    // v2.9: hoekpunten klemmen binnen het bereik van de échte randpunten,
    // zodat een lijn die doorloopt buiten de kaart niet meer kan croppen.
    function rangeOf(pts,idx){ var mn=1e9,mx=-1e9; pts.forEach(function(p){ if(p[idx]<mn)mn=p[idx]; if(p[idx]>mx)mx=p[idx]; }); return [mn,mx]; }
    var xr=rangeOf(leftPts.concat(rightPts),0), yr=rangeOf(topPts.concat(botPts),1);
    function clampPt(p){
      return [Math.min(Math.max(p[0],xr[0]),xr[1]), Math.min(Math.max(p[1],yr[0]),yr[1])];
    }
    TL=clampPt(TL); TR=clampPt(TR); BR=clampPt(BR); BL=clampPt(BL);
    var inv=1/sc, cl=function(v,mx){ return Math.min(Math.max(v,0),mx); };
    var quad=[ [cl(TL[0]*inv,nw),cl(TL[1]*inv,nh)], [cl(TR[0]*inv,nw),cl(TR[1]*inv,nh)],
               [cl(BR[0]*inv,nw),cl(BR[1]*inv,nh)], [cl(BL[0]*inv,nw),cl(BL[1]*inv,nh)] ];
    var area=Math.abs((quad[1][0]-quad[0][0])*(quad[3][1]-quad[0][1])-(quad[3][0]-quad[0][0])*(quad[1][1]-quad[0][1]));
    if(area<0.03*nw*nh) return null;
    var edge={l:[],r:[],t:[],b:[]}, yy2, ii;
    for(yy2=0;yy2<h;yy2++){ if(lx[yy2]!==null) edge.l.push([lx[yy2]*inv, yy2*inv]); if(rx[yy2]!==null) edge.r.push([rx[yy2]*inv, yy2*inv]); }
    for(ii=0;ii<w;ii++){ if(ty[ii]!==null) edge.t.push([ii*inv, ty[ii]*inv]); if(by[ii]!==null) edge.b.push([ii*inv, by[ii]*inv]); }
    var nPts=edge.l.length+edge.r.length+edge.t.length+edge.b.length;
    return { quad:quad, edge:edge, nPts:nPts };
  }

  var candidates = vary<40 ? [45,70,110,150] : [70,110,150,45];
  for(var ti=0; ti<candidates.length; ti++){
    var q=tryQuad(candidates[ti]);
    if(q) return q;
  }
  return null;
}

function autoDetect(){
  dims={ w:img.naturalWidth, h:img.naturalHeight };
  var q=detectCard(img);
  if(q){
    rect={ tl:{x:q.quad[0][0],y:q.quad[0][1]}, tr:{x:q.quad[1][0],y:q.quad[1][1]}, br:{x:q.quad[2][0],y:q.quad[2][1]}, bl:{x:q.quad[3][0],y:q.quad[3][1]} };
    rect.edge=q.edge; rect.nPts=q.nPts;
    document.getElementById("scanNote").innerHTML='<div class="note">✅ Kaartrand gedetecteerd ('+q.nPts+' randpunten). Tik op 🎯 analyseren.</div>';
  } else {
    rect=null;
    document.getElementById("scanNote").innerHTML='<div class="note">❌ Kaartrand niet gevonden. Maak de foto opnieuw: kaart volledig in beeld, egale ondergrond, iPhone er recht boven.</div>';
  }
  drawCrop();
}

function drawCrop(){
  var svg=document.getElementById("cropSvg"); if(!svg) return;
  svg.setAttribute("viewBox","0 0 "+dims.w+" "+dims.h);
  var sw=Math.max(2,dims.w/300);
  if(!rect||!rect.edge){ svg.innerHTML=""; return; }
  // nette omlijning: de gefitte 4-hoekige kaartrand (geen kruis door de kaart)
  var poly=rect.tl.x+","+rect.tl.y+" "+rect.tr.x+","+rect.tr.y+" "+rect.br.x+","+rect.br.y+" "+rect.bl.x+","+rect.bl.y;
  svg.innerHTML='<polygon points="'+poly+'" fill="none" stroke="#22c55e" stroke-width="'+sw+'" stroke-linejoin="round"/>';
}

// ---------- Centering: grijze rand meten ----------
function analyzeCentering(){
  if(!rect) return null;
  var W=340, H=Math.round(340*88/63);
  // minieme inset: meetkader 1% naar binnen zodat achtergrond-slierten buiten de kaart niet mee gemeten worden
  var q0=[[rect.tl.x,rect.tl.y],[rect.tr.x,rect.tr.y],[rect.br.x,rect.br.y],[rect.bl.x,rect.bl.y]];
  var cx0=(q0[0][0]+q0[1][0]+q0[2][0]+q0[3][0])/4, cy0=(q0[0][1]+q0[1][1]+q0[2][1]+q0[3][1])/4;
  var quad=q0.map(function(p){ return [p[0]+(cx0-p[0])*0.02, p[1]+(cy0-p[1])*0.02]; });
  var wp=warpToQuad(quad,W,H);
  if(!wp){ return { fail:true, help:"warp mislukt (homografie onoplosbaar — kaart te scheef?)",
    tTop:null,tBot:null,tLeft:null,tRight:null }; }
  if(wp.canvasFail){ return { fail:true, help:"canvas niet gevuld — foto kon niet gelezen worden (canvasFail)",
    tTop:null,tBot:null,tLeft:null,tRight:null }; }
  var data=wp.data, w=W, h=H;
  function px(x,y){ var i=(y*w+x)*4; return [data[i],data[i+1],data[i+2]]; }
  var w2=w, h2=h;
  // v2.4: adaptieve meting — geen vaste drempel, maar per zijde zelf kalibreren
  // + ruis-onderdrukking via gesmeerde gradient (buren-middeling)
  function measureSide(fromStart,horizontal){
    var len=horizontal?h:w, span=horizontal?w:h;
  var lines=[];
  var margin=Math.floor(span*0.15);
  // v2.12: binnenrand zit ALTIJD vlak achter de gele randstrook (~15% van de kaart).
  // Met de oude 45%-diepte pakte de meting bij zwakke kaderlijn (glans) een
  // artwork-overgang diep in de kaart -> "heel ver naar binnen". Nu: venster 15%.
  var skip=Math.max(20,Math.floor(len*0.15));
  for(var pos=margin;pos<span-margin;pos++){
      // lijn inlezen met 1px marge voor smoothing
      var pts=[], kk, dd;
      for(kk=0;kk<=skip+2;kk++){
        dd=fromStart?kk:len-1-kk;
        pts.push(horizontal?px(pos,dd):px(dd,pos));
      }
      // gesmeerde gradients: verschil tussen 2px-afstand = minder ruisgevoelig
      var grads=[0,0];
      for(kk=2;kk<pts.length;kk++){
        grads.push(Math.abs(pts[kk][0]-pts[kk-2][0])+Math.abs(pts[kk][1]-pts[kk-2][1])+Math.abs(pts[kk][2]-pts[kk-2][2]));
      }
      var bestK=-1, bestG=0;
      for(kk=3;kk<skip;kk++) if(grads[kk]>bestG){ bestG=grads[kk]; bestK=kk; }
      lines.push({ pos:pos, bestK:bestK, bestG:bestG });
    }
    if(lines.length===0) return null;
    // kalibratie: mediaan van de sterkste pieken bepaalt de drempel
    var gs=lines.map(function(l){ return l.bestG; }).sort(function(a,b){ return a-b; });
    var medG=gs[Math.floor(gs.length/2)];
    var thr=Math.max(10, medG*0.5);
    var th=[], maxSeen=0;
    lines.forEach(function(l){
      if(l.bestG>maxSeen) maxSeen=l.bestG;
      if(l.bestG>=thr&&l.bestK>0) th.push(l.bestK);
    });
    if(th.length===0) return { fail:true, medG:Math.round(medG), maxG:Math.round(maxSeen), skip:skip };
    th.sort(function(a,b){ return a-b; });
    var mid=Math.floor(th.length/2);
    var val=th.length%2===1 ? th[mid] : (th[mid-1]+th[mid])/2;
    return { v:val, medG:Math.round(medG), maxG:Math.round(maxSeen), skip:skip };
  }
  var rTop=measureSide(true,true), rBot=measureSide(false,true);
  var rLeft=measureSide(true,false), rRight=measureSide(false,false);
  if(!rTop||!rBot||!rLeft||!rRight||rTop.fail||rBot.fail||rLeft.fail||rRight.fail){
    return { fail:true, tTop:rTop, tBot:rBot, tLeft:rLeft, tRight:rRight,
      help:"piek-mediaan per zijde: top "+diag(rTop)+", onder "+diag(rBot)+", links "+diag(rLeft)+", rechts "+diag(rRight) };
  }
  var tTop=rTop.v, tBot=rBot.v, tLeft=rLeft.v, tRight=rRight.v;

  var midTop=tTop/2, midBot=h-tBot/2, midLeft=tLeft/2, midRight=w-tRight/2;
  var cx=w/2, cy=h/2;
  var offX=((midRight-cx)-(cx-midLeft));
  var offY=((midBot-cy)-(cy-midTop));
  var devLR=Math.abs(offX)/w*100, devTB=Math.abs(offY)/h*100;

  function fmt(p,q){ var t=Math.round(p*10)/10,u=Math.round(q*10)/10; return Math.max(t,u).toFixed(1)+"/"+Math.min(t,u).toFixed(1); }
  var maxDev=Math.max(devLR,devTB);
  var grade=10;
  if(maxDev>6) grade=6; else if(maxDev>4) grade=7; else if(maxDev>2.5) grade=8; else if(maxDev>1.2) grade=9; else if(maxDev>0.4) grade=9.5;
  var notes=[ "Randdikte boven/onder: "+(Math.round(tTop*10)/10)+"px / "+(Math.round(tBot*10)/10)+"px  ("+fmt(tTop,tBot)+")",
          "Randdikte links/rechts: "+(Math.round(tLeft*10)/10)+"px / "+(Math.round(tRight*10)/10)+"px  ("+fmt(tLeft,tRight)+")",
          "Middenafwijking links-rechts: "+(Math.round(devLR*100)/100)+"%"+(offX>0?" (rand rechts dikker)":" (rand links dikker)"),
          "Middenafwijking boven-onder: "+(Math.round(devTB*100)/100)+"%"+(offY>0?" (rand onder dikker)":" (rand boven dikker)") ];
  if(grade>=9.5) notes.push("Praktisch perfect gecenterd 🎉");
  else if(grade>=9) notes.push("Goed gecenterd — scoort doorgaans 9-10 bij grading.");
  else if(grade>=8) notes.push("Acceptabel gecenterd, kans op 8-9.");
  else notes.push("Zichtbaar off-center — beïnvloedt de grade flink.");

  var vc=document.createElement("canvas"); vc.width=w; vc.height=h;
  var vctx=vc.getContext("2d");
  var id=vctx.createImageData(w,h);
  for(var ii=0;ii<data.length;ii++) id.data[ii]=data[ii];
  vctx.putImageData(id,0,0);
  var vis='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block">'
    +'<image href="'+vc.toDataURL("image/png")+'" x="0" y="0" width="'+w+'" height="'+h+'"/>'
    +'<rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'" fill="none" stroke="#facc15" stroke-width="2"/>'
    +'<rect x="'+tLeft+'" y="'+tTop+'" width="'+(w-tLeft-tRight)+'" height="'+(h-tTop-tBot)+'" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="5 4"/>'
    +'<line x1="'+cx+'" y1="0" x2="'+cx+'" y2="'+h+'" stroke="#f87171" stroke-width="1" stroke-dasharray="3 5"/>'
    +'<line x1="0" y1="'+cy+'" x2="'+w+'" y2="'+cy+'" stroke="#f87171" stroke-width="1" stroke-dasharray="3 5"/>'
    +'<circle cx="'+midLeft+'" cy="'+cy+'" r="4" fill="#38bdf8"/>'
    +'<circle cx="'+midRight+'" cy="'+cy+'" r="4" fill="#38bdf8"/>'
    +'<circle cx="'+cx+'" cy="'+midTop+'" r="4" fill="#38bdf8"/>'
    +'<circle cx="'+cx+'" cy="'+midBot+'" r="4" fill="#38bdf8"/>'
    +'</svg>';
  var tc=document.createElement("canvas"); tc.width=68; tc.height=Math.round(68*h/w*1);
  tc.width=68; tc.height=Math.round(68*(h/w));
  tc.getContext("2d").drawImage(vc,0,0,tc.width,tc.height);
  var thumb=tc.toDataURL("image/jpeg",0.5);
  return { grade:grade, notes:notes, vis:vis, thumb:thumb, devLR:devLR, devTB:devTB,
           tTop:tTop, tBot:tBot, tLeft:tLeft, tRight:tRight };
}

function gradeColor(g){ return g>=9.5?"#22c55e":g>=9?"#84cc16":g>=8?"#eab308":"#f97316"; }
function diag(r){ if(!r) return "onbekend"; return r.fail ? "❌piek~"+r.medG : r.v.toFixed(1)+"px"; }
function runAnalysis(){
  if(!img||!rect) return;
  var res=analyzeCentering();
  var el=document.getElementById("resultScroll");
  if(!res||res.canvasFail){ el.innerHTML='<div class="note">Analyse mislukt — '+((res&&res.help)||"onbekende fout")+'. Probeer de foto opnieuw te selecteren uit de bibliotheek.</div>'; showView("resultView"); return; }
  if(res.fail){ el.innerHTML='<div class="note">Rand niet gevonden — '+res.help+'<br><br>📱 Kopieer deze regel en stuur hem in de chat: <br><small style="color:#94a3b8">v'+VERSION+' | '+diag(res.tTop)+' | '+diag(res.tBot)+' | '+diag(res.tLeft)+' | '+diag(res.tRight)+'</small></div>'; showView("resultView"); return; }
  var legenda='<p class="n" style="margin-top:8px">🟡 buitenrand &nbsp;·&nbsp; 🔵 gestippeld: binnenrand &nbsp;·&nbsp; 🔴 kaartmidden &nbsp;·&nbsp; 🔵 stippen: randmidden</p>';
  el.innerHTML='<div class="card"><div class="score"><span>Centering score</span><b style="color:'+gradeColor(res.grade)+'">'+res.grade+'</b></div>'
    +'<div class="bar"><div style="width:'+(res.grade*10)+'%;background:'+gradeColor(res.grade)+'"></div></div>'
    +'<div class="zoomWrap" id="zoomWrap"><div class="zoomInner" id="zoomInner">'+res.vis+'</div></div>'+legenda
    +res.notes.map(function(n){ return '<p class="n">'+n+'</p>'; }).join("")+'</div>';
  attachZoom();
  saveScan(res);
  showView("resultView");
}

// ---------- Zoom op de analyse-visualisatie ----------
var zs=1;
function setZoom(s){
  zs=Math.min(4,Math.max(0.5,s));
  var inner=document.getElementById("zoomInner");
  if(inner) inner.style.transform="scale("+zs+")";
}
function attachZoom(){
  var wrap=document.getElementById("zoomWrap"); if(!wrap) return;
  var pts={}, lastDist=0, lastPan=null, lastTap=0;
  wrap.onpointerdown=function(e){
    e.preventDefault();
    pts[e.pointerId]=[e.clientX,e.clientY];
    try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
    if(Object.keys(pts).length===1){
      var now=Date.now();
      if(now-lastTap<300){ setZoom(zs>1.4?1:2.5); }
      lastTap=now;
      lastPan=[e.clientX,e.clientY];
    }
    if(Object.keys(pts).length===2){
      var ids=Object.keys(pts);
      lastDist=Math.hypot(pts[ids[0]][0]-pts[ids[1]][0], pts[ids[0]][1]-pts[ids[1]][1]);
    }
  };
  wrap.onpointermove=function(e){
    if(!(e.pointerId in pts)) return;
    pts[e.pointerId]=[e.clientX,e.clientY];
    var ids=Object.keys(pts);
    if(ids.length===2){
      var d=Math.hypot(pts[ids[0]][0]-pts[ids[1]][0], pts[ids[0]][1]-pts[ids[1]][1]);
      if(lastDist>0) setZoom(zs*d/lastDist);
      lastDist=d;
      lastPan=null;
    } else if(lastPan){
      wrap.scrollLeft-=(e.clientX-lastPan[0]);
      wrap.scrollTop-=(e.clientY-lastPan[1]);
      lastPan=[e.clientX,e.clientY];
    }
  };
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    wrap.addEventListener(ev,function(e){
      delete pts[e.pointerId];
      if(Object.keys(pts).length<2) lastDist=0;
      lastPan=null;
    });
  });
  setZoom(1);
}

// ---------- Scan-database (lokaal opgeslagen op deze iPhone) ----------
function getScans(){
  try{ return JSON.parse(localStorage.getItem("mcScans")||"[]"); }catch(e){ return []; }
}
function saveScan(res){
  try{
    var scans=getScans();
    scans.unshift({ d:new Date().toLocaleString("nl-NL"), g:res.grade,
      lr:Math.round(res.devLR*100)/100, tb:Math.round(res.devTB*100)/100,
      tT:Math.round(res.tTop*10)/10, tB:Math.round(res.tBot*10)/10,
      tL:Math.round(res.tLeft*10)/10, tR:Math.round(res.tRight*10)/10,
      t:res.thumb });
    if(scans.length>200) scans=scans.slice(0,200);
    localStorage.setItem("mcScans", JSON.stringify(scans));
  }catch(e){}
}
function delScan(i){
  var scans=getScans(); scans.splice(i,1);
  try{ localStorage.setItem("mcScans", JSON.stringify(scans)); }catch(e){}
  renderHistory();
}
function clearScans(){
  if(!confirm("Alle opgeslagen scans wissen?")) return;
  try{ localStorage.removeItem("mcScans"); }catch(e){}
  renderHistory();
}
function renderHistory(){
  var scans=getScans(), el=document.getElementById("histScroll"), html="";
  if(scans.length===0){
    html='<div class="note" style="margin-top:16px">Nog geen gescande kaarten. Maak een foto en analyseer hem — daarna verschijnt hij hier automatisch in je collectie.</div>';
  } else {
    var sum=0, best=scans[0], worst=scans[0];
    scans.forEach(function(s){ sum+=s.g; if(s.g>best.g) best=s; if(s.g<worst.g) worst=s; });
    var avg=Math.round(sum/scans.length*10)/10;
    function gColor(g){ return gradeColor(g); }
    html+='<div class="card"><div class="score"><span>Rapport — '+scans.length+' kaart'+(scans.length===1?"":"en")+'</span></div>'
      +'<div class="bar"><div style="width:'+(avg*10)+'%;background:'+gColor(avg)+'"></div></div>'
      +'<p class="n">📊 Gemiddelde centering score: <b style="color:'+gColor(avg)+'">'+avg+'</b></p>'
      +'<p class="n">🏆 Beste: '+best.g+' ('+best.d+')</p>'
      +'<p class="n">⚠️ Slechtste: '+worst.g+' ('+worst.d+')</p></div>';
    scans.forEach(function(s,i){
      html+='<div class="scanItem">'
        +'<img src="'+(s.t||"")+'" alt="scan">'
        +'<div class="si"><div class="sd">'+s.d+'</div>'
        +'<div class="sg" style="color:'+gColor(s.g)+'">'+s.g+'</div>'
        +'<div class="sd">afw. LR '+s.lr+'% · TB '+s.tb+'%</div></div>'
        +'<button onclick="delScan('+i+')">✕</button></div>';
    });
  }
  el.innerHTML=html;
  showView("historyView");
}
function exportCSV(){
  var scans=getScans();
  if(scans.length===0){ alert("Nog geen scans om te exporteren."); return; }
  var csv="datum;tijd;score;afwijking_LR_%;afwijking_TB_%;rand_boven_px;rand_onder_px;rand_links_px;rand_rechts_px\n";
  scans.forEach(function(s){
    csv+=[s.d.replace(", ",";"), s.g, s.lr, s.tb, s.tT, s.tB, s.tL, s.tR].join(";")+"\n";
  });
  window.open("data:text/csv;charset=utf-8,"+encodeURIComponent(csv));
}
